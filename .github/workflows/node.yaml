name: Node CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Install deps
        run: npm install

      - name: Run tests
        run: npm test

  oracle:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean_spec/.lake
          key: lean-v4.22.0-${{ hashFiles('lean_spec/lean-toolchain', 'lean_spec/lakefile.lean', 'lean_spec/BlogGasSpec.lean', 'lean_spec/BlogGasSpec/**', 'lean_spec/Main.lean') }}

      - name: Install elan (Lean 4.22.0)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.22.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify proofs and build the oracle
        working-directory: lean_spec
        run: |
          lake build
          lake build bloggas_oracle

      - name: Install deps
        run: npm install

      - name: Differential test against the Lean oracle
        run: npm run test:oracle

  deploy-prod:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Install clasp
        run: npm i -g @google/clasp

      - name: Write clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push dist to Apps Script (production)
        run: clasp push --force

      - name: Create version
        id: version
        run: |
          OUT=$(clasp create-version "Auto deploy from Node CI")
          VER=$(echo "$OUT" | grep -Eo '[0-9]+' | tail -1)
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Deploy
        run: |
          if [ -n "${{ secrets.DEPLOYMENT_ID }}" ]; then
            clasp update-deployment \
              "${{ secrets.DEPLOYMENT_ID }}" \
              -V "${{ steps.version.outputs.ver }}" \
              -d "Auto deploy from Node CI"
          else
            clasp create-deployment \
              -V "${{ steps.version.outputs.ver }}" \
              -d "Auto deploy from Node CI"
          fi

  deploy-staging:
    needs: [test, oracle]
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      - name: Install clasp
        run: npm i -g @google/clasp

      - name: Write clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Point clasp at the staging project
        run: |
          jq --arg id "${{ secrets.STAGING_SCRIPT_ID }}" '.scriptId = $id' .clasp.json > .clasp.json.tmp
          mv .clasp.json.tmp .clasp.json

      - name: Push dist to Apps Script (staging)
        run: clasp push --force

      - name: Create version
        id: version
        run: |
          OUT=$(clasp create-version "Auto deploy from Node CI (staging)")
          VER=$(echo "$OUT" | grep -Eo '[0-9]+' | tail -1)
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Deploy (staging)
        run: |
          if [ -n "${{ secrets.STAGING_DEPLOYMENT_ID }}" ]; then
            clasp update-deployment \
              "${{ secrets.STAGING_DEPLOYMENT_ID }}" \
              -V "${{ steps.version.outputs.ver }}" \
              -d "Auto deploy from Node CI (staging)"
          else
            clasp create-deployment \
              -V "${{ steps.version.outputs.ver }}" \
              -d "Auto deploy from Node CI (staging)"
          fi
